<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العاب مجانية</title>
<style>
body{margin:0;background:#0f0f1a;color:white;font-family:Arial;}
h1{text-align:center;color:#a855f7;padding:20px;}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px;}
.game{background:#1a1a2e;border-radius:12px;padding:20px;text-align:center;border:1px solid #a855f7;}
.game h3{color:#a855f7;margin:0 0 10px;}
.game p{color:#aaa;font-size:13px;}
.btn{background:#a855f7;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;width:100%;font-size:14px;}
</style>
</head>
<body>
<h1>🎮 العاب مجانية</h1>
<div class="games">
<div class="game"><h3>Snake</h3><p>لعبة الثعبان الكلاسيكية</p><button class="btn">العب الآن</button></div>
<div class="game"><h3>Tetris</h3><p>رتب المكعبات</p><button class="btn">العب الآن</button></div>
<div class="game"><h3>2048</h3><p>ادمج الأرقام</p><button class="btn">العب الآن</button></div>
<div class="game"><h3>Breakout</h3><p>كسر الطوب</p><button class="btn">العب الآن</button></div>
</div>
</body>
</html>
