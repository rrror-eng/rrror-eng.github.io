<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العاب مجانية</title>
<style>
body{margin:0;background:#0f0f1a;color:white;font-family:Arial;text-align:center;}
h1{color:#a855f7;padding:20px;}
canvas{border:2px solid #a855f7;border-radius:8px;}
#score{font-size:20px;margin:10px;color:#a855f7;}
#msg{font-size:18px;color:white;margin:10px;}
button{background:#a855f7;color:white;border:none;padding:12px 30px;border-radius:8px;font-size:16px;cursor:pointer;margin:10px;}
</style>
</head>
<body>
<h1>🎮 لعبة Snake</h1>
<div id="score">النقاط: 0</div>
<canvas id="c" width="300" height="300"></canvas>
<div id="msg">اضغط ابدأ للعب</div>
<button onclick="startGame()">ابدأ</button>
<br><br>
<button onclick="location.href='index.html'">🏠 الرئيسية</button>
<script>
var c=document.getElementById('c');
var ctx=c.getContext('2d');
var snake=[{x:150,y:150}];
var dir={x:10,y:0};
var food={x:50,y:50};
var score=0;
var game;
function draw(){
ctx.fillStyle='#0f0f1a';
ctx.fillRect(0,0,300,300);
ctx.fillStyle='#a855f7';
snake.forEach(function(s){ctx.fillRect(s.x,s.y,9,9);});
ctx.fillStyle='red';
ctx.fillRect(food.x,food.y,9,9);
}
function move(){
var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(head.x<0||head.x>=300||head.y<0||head.y>=300){endGame();return;}
snake.unshift(head);
if(head.x==food.x&&head.y==food.y){
score+=10;
document.getElementById('score').innerHTML='النقاط: '+score;
food={x:Math.floor(Math.random()*30)*10,y:Math.floor(Math.random()*30)*10};
}else{snake.pop();}
draw();
}
function startGame(){
snake=[{x:150,y:150}];
dir={x:10,y:0};
score=0;
document.getElementById('score').innerHTML='النقاط: 0';
document.getElementById('msg').innerHTML='';
clearInterval(game);
game=setInterval(move,150);
}
function endGame(){
clearInterval(game);
document.getElementById('msg').innerHTML='انتهت اللعبة! نقاطك: '+score;
}
document.addEventListener('keydown',function(e){
if(e.key=='ArrowUp')dir={x:0,y:-10};
if(e.key=='ArrowDown')dir={x:0,y:10};
if(e.key=='ArrowLeft')dir={x:-10,y:0};
if(e.key=='ArrowRight')dir={x:10,y:0};
});
</script>
</body>
</html>
