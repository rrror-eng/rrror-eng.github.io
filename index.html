<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العاب مجانية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;color:white;font-family:Arial;}
header{background:#1a1a2e;padding:15px;text-align:center;border-bottom:2px solid #a855f7;}
header h1{color:#a855f7;font-size:22px;}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px;}
.game{background:#1a1a2e;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #2a2a4e;}
.game img{width:100%;height:100px;object-fit:cover;}
.game-title{font-size:12px;padding:6px;text-align:center;color:#ddd;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;flex-direction:column;}
.modal.open{display:flex;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#1a1a2e;}
.modal-header h3{color:#a855f7;font-size:14px;}
.close-btn{background:#a855f7;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;}
.modal iframe{flex:1;border:none;width:100%;height:100%;}
</style>
</head>
<body>
<header>
  <h1>🎮 العاب مجانية</h1>
</header>
<div class="games">
  <div class="game" onclick="openGame('https://www.gamepix.com/play/2048-game','2048')">
    <img src="https://img.gamepix.com/games/2048-game/cover/2048-game.jpg?w=300&h=200&fit=cover" onerror="this.style.background='#a855f7';this.style.height='100px'">
    <div class="game-title">2048</div>
  </div>
  <div class="game" onclick="openGame('https://www.gamepix.com/play/snake-game','Snake')">
    <img src="https://img.gamepix.com/games/snake-game/cover/snake-game.jpg?w=300&h=200&fit=cover" onerror="this.style.background='#7c3aed';this.style.height='100px'">
    <div class="game-title">Snake</div>
  </div>
  <div class="game" onclick="openGame('https://www.gamepix.com/play/tetris','Tetris')">
    <img src="https://img.gamepix.com/games/tetris/cover/tetris.jpg?w=300&h=200&fit=cover" onerror="this.style.background='#6d28d9';this.style.height='100px'">
    <div class="game-title">Tetris</div>
  </div>
  <div class="game" onclick="openGame('https://www.gamepix.com/play/bubble-shooter','Bubble')">
    <img src="https://img.gamepix.com/games/bubble-shooter/cover/bubble-shooter.jpg?w=300&h=200&fit=cover" onerror="this.style.background='#5b21b6';this.style.height='100px'">
    <div class="game-title">Bubble Shooter</div>
  </div>
  <div class="game" onclick="openGame('https://www.gamepix.com/play/mahjong','Mahjong')">
    <img src="https://img.gamepix.com/games/mahjong/cover/mahjong.jpg?w=300&h=200&fit=cover" onerror="this.style.background='#4c1d95';this.style.height='100px'">
    <div class="game-title">Mahjong</div>
  </div>
  <div class="game" onclick="openGame('https://www.gamepix.com/play/solitaire','Solitaire')">
    <img src="https://img.gamepix.com/games/solitaire/cover/solitaire.jpg?w=300&h=200&fit=cover" onerror="this.style.background='#3b0764';this.style.height='100px'">
    <div class="game-title">Solitaire</div>
  </div>
</div>
<div class="modal" id="modal">
  <div class="modal-header">
    <h3 id="game-title">اللعبة</h3>
    <button class="close-btn" onclick="closeGame()">✕ إغلاق</button>
  </div>
  <iframe id="game-frame" src="" allowfullscreen></iframe>
</div>
<script>
function openGame(url,title){
  document.getElementById('modal').classList.add('open');
  document.getElementById('game-frame').src=url;
  document.getElementById('game-title').innerHTML=title;
}
function closeGame(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('game-frame').src='';
}
</script>
</body>
</html>
