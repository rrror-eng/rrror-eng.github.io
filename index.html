<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العاب مجانية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;color:white;font-family:Arial;}
header{background:#1a1a2e;padding:15px;text-align:center;border-bottom:2px solid #a855f7;}
header h1{color:#a855f7;font-size:24px;}
.search{padding:10px;background:#111;text-align:center;}
.search input{width:90%;padding:10px;border-radius:20px;border:1px solid #a855f7;background:#1a1a2e;color:white;font-size:14px;}
.cats{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#111;}
.cat{background:#1a1a2e;color:#a855f7;border:1px solid #a855f7;padding:6px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;font-size:13px;}
.cat.active{background:#a855f7;color:white;}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;}
.game{background:#1a1a2e;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid #2a2a4e;}
.game img{width:100%;height:80px;object-fit:cover;}
.game-title{font-size:11px;padding:5px;text-align:center;color:#ddd;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;}
.modal.open{display:flex;flex-direction:column;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#1a1a2e;}
.modal-header h3{color:#a855f7;}
.close-btn{background:#a855f7;color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;}
.modal iframe{flex:1;border:none;width:100%;}
</style>
</head>
<body>
<header>
  <h1>🎮 العاب مجانية</h1>
</header>
<div class="search">
  <input type="text" placeholder="ابحث عن لعبة...">
</div>
<div class="cats">
  <div class="cat active">الكل</div>
  <div class="cat">أكشن</div>
  <div class="cat">بازل</div>
  <div class="cat">سباق</div>
  <div class="cat">رياضة</div>
  <div class="cat">مغامرة</div>
</div>
<div class="games">
  <div class="game" onclick="openGame('https://www.crazygames.com/embed/slope','Slope')">
    <img src="https://imgs.crazygames.com/slope_16x9/20240606091823/slope_16x9-cover?auto=format&fit=crop&h=200&w=300" onerror="this.src='https://via.placeholder.com/300x200/1a1a2e/a855f7?text=Slope'">
    <div class="game-title">Slope</div>
  </div>
  <div class="game" onclick="openGame('https://www.crazygames.com/embed/1010-deluxe','1010')">
    <img src="https://imgs.crazygames.com/1010-deluxe/20230601130201/1010-deluxe-cover?auto=format&fit=crop&h=200&w=300" onerror="this.src='https://via.placeholder.com/300x200/1a1a2e/a855f7?text=1010'">
    <div class="game-title">1010 Deluxe</div>
  </div>
  <div class="game" onclick="openGame('https://www.crazygames.com/embed/moto-x3m','Moto X3M')">
    <img src="https://imgs.crazygames.com/moto-x3m/20220103093524/moto-x3m-cover?auto=format&fit=crop&h=200&w=300" onerror="this.src='https://via.placeholder.com/300x200/1a1a2e/a855f7?text=Moto+X3M'">
    <div class="game-title">Moto X3M</div>
  </div>
  <div class="game" onclick="openGame('https://www.crazygames.com/embed/subway-surfers','Subway')">
    <img src="https://imgs.crazygames.com/subway-surfers/20220103093524/subway-surfers-cover?auto=format&fit=crop&h=200&w=300" onerror="this.src='https://via.placeholder.com/300x200/1a1a2e/a855f7?text=Subway'">
    <div class="game-title">Subway Surfers</div>
  </div>
  <div class="game" onclick="openGame('https://www.crazygames.com/embed/temple-run-2','Temple Run')">
    <img src="https://imgs.crazygames.com/temple-run-2/20220103093524/temple-run-2-cover?auto=format&fit=crop&h=200&w=300" onerror="this.src='https://via.placeholder.com/300x200/1a1a2e/a855f7?text=Temple+Run'">
    <div class="game-title">Temple Run 2</div>
  </div>
  <div class="game" onclick="openGame('https://www.crazygames.com/embed/among-us-online-edition','Among Us')">
    <img src="https://imgs.crazygames.com/among-us-online-edition/20220103093524/among-us-online-edition-cover?auto=format&fit=crop&h=200&w=300" onerror="this.src='https://via.placeholder.com/300x200/1a1a2e/a855f7?text=Among+Us'">
    <div class="game-title">Among Us</div>
  </div>
</div>
<div class="modal" id="modal">
  <div class="modal-header">
    <h3 id="game-title">اللعبة</h3>
    <button class="close-btn" onclick="closeGame()">✕ إغلاق</button>
  </div>
  <iframe id="game-frame" src=""></iframe>
</div>
<script>
function openGame(url,title){
  document.getElementById('modal').classList.add('open');
  document.getElementById('game-frame').src=url;
  document.getElementById('game-title').innerHTML=title;
}
function closeGame(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('game-frame').src='';
}
</script>
</body>
</html>
